<!doctype html>
<!-- Adventure playthrough: drives src/adventure.js with a scripted plane through every chapter, from a fresh save,
     and prints each step and story card; then checks that an old "finished everything" save unlocks newer chapters.
     Run with tools/adventure.sh (prints the log), or open it in a browser (served over http). A step the script can't
     complete shows as "STUCK"; the title is "DONE ok" or "DONE FAIL". -->
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head><body>
<div id="story" hidden><div class="letter"><p class="kicker"></p><h2></h2><p class="body"></p><p class="stamp" hidden></p><button></button></div></div>
<pre id="log"></pre>
<script type="module">
import * as THREE from 'three';
import { buildWorld, STRIPS } from '../src/world.js';
import { createAdventure } from '../src/adventure.js';
const log = [], KEY = 'biplane.adventure.v1';
let ok = true;
try {
  const scene = new THREE.Scene(), world = buildWorld(scene);
  const flight = { pos: new THREE.Vector3(), vel: new THREE.Vector3(), q: new THREE.Quaternion(), state: 'ground', heading: 0, throttle: 0, speed: 0, flown: false };
  const fly = (st) => { flight.pos.set(st.strip.x, st.strip.h, st.strip.z); Object.assign(flight, { state: 'ground', flown: false, speed: 0 }); };
  const card = document.getElementById('story'), input = { consume: () => false };
  const make = () => createAdventure({ scene, world, flight, fly, setTime: (t) => t && log.push(`    (time: ${t})`), onFlags: (f) => log.push(`    (flags: ${Object.keys(f).join(', ')})`) });
  const tick = (adv, n) => { for (let i = 0; i < n; i++) adv.update(0.05, input, true); };
  const close = () => { const k = card.querySelector('.kicker').textContent, t = card.querySelector('h2').textContent; card.querySelector('button').click(); return `${k} / ${t}`; };

  localStorage.removeItem(KEY);
  const adv = make();
  log.push('menu: ' + adv.summary());
  let chapters = 0;
  for (let round = 0; round < 12 && chapters < 50; round++) { // one chapter per begin(): intro, missions, final letter
    adv.begin();
    for (let guard = 0; guard < 80 && adv.active; guard++) {
      if (!card.hidden) { log.push('  card: ' + close()); continue; }
      const tg = adv.target;
      if (!tg) { log.push('  STUCK: no card and no target'); ok = false; break; }
      const st = STRIPS.find((s) => tg.label.endsWith(' · ' + s.name));
      if (st) { // land on the strip and roll to a stop; the ground scene (villager walks up) plays out
        Object.assign(flight, { state: 'ground', flown: true, speed: 0 }); flight.pos.set(st.x, st.h, st.z); flight.vel.set(0, 0, 0);
        log.push('  land ' + st.name); tick(adv, 300);
      } else if (tg.label.startsWith('Circle')) { // loop around it inside the ring
        flight.state = 'air'; log.push('  ' + tg.label.replace(/ · \d+%$/, ''));
        for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI * 2.2; flight.pos.set(tg.x + Math.cos(a) * 150, 150, tg.z + Math.sin(a) * 150); tick(adv, 1); if (!card.hidden || adv.target?.label !== tg.label.replace(/ · \d+%$/, '') && !adv.target?.label.startsWith('Circle')) break; }
      } else { // pass / drop: over the point, 40 m up, then fly on while a parcel floats down
        flight.state = 'air'; flight.pos.set(tg.x, Math.max(world.groundAt(tg.x, tg.z), 0) + 40, tg.z); flight.vel.set(35, 0, 0);
        log.push('  over: ' + tg.label); tick(adv, 1);
        let t = 0;
        while (adv.target?.label === 'Parcel away!' && t < 60) { tick(adv, 1); t += 0.05; }
        if (t) log.push(`    parcel down after ${t.toFixed(1)} s`);
      }
      if (adv.target && adv.target.label === tg.label && card.hidden) { log.push('  STUCK at: ' + tg.label); ok = false; break; }
    }
    const s = JSON.parse(localStorage.getItem(KEY) ?? '{}');
    chapters++;
    log.push(`save: ${JSON.stringify(s)}`);
    if (s.done) break;
  }
  if (!JSON.parse(localStorage.getItem(KEY) ?? '{}').done) { log.push('FAIL: never reached the end'); ok = false; }
  log.push('menu at the end: ' + adv.summary());

  // an old save that had finished everything before `through` existed (2 chapters): the next chapter unlocks
  localStorage.setItem(KEY, JSON.stringify({ chapter: 0, mission: 0, done: true, flags: { lamp: true } }));
  log.push('old finished save -> menu: ' + make().summary());
} catch (e) { log.push('ERR ' + e.message + '\n' + e.stack); ok = false; }
document.getElementById('log').textContent = log.join('\n');
document.title = ok ? 'DONE ok' : 'DONE FAIL';
</script></body></html>
